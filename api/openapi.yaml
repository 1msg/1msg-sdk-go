  /sendCarousel:
    post:
      description: "You can send product cards via Carousel in two ways:\n\nTemplate\
        \ messages: do not require a 24-hour customer service window between you and\
        \ the recipient. Use sendTemplate.\n\nFree-form messages: can be sent only\
        \ when a customer service window is open between you and the recipient. Use\
        \ sendCarousel.\n\nThe message structure in /sendCarousel is largely similar\
        \ to sending a template. However, in this case you must \nexplicitly specify\
        \ all elements that are created in advance when working with templates. This\
        \ is because the message \nis sent without using a template.\n\nIn /sendCarousel,\
        \ for a Catalog Carousel there can be either 1 URL button or one or more quick\
        \ reply buttons.\n\nPrefer the simple `cards` array (2–10 cards). Each card\
        \ needs a header media/product\nplus a CTA URL or quick-reply buttons. Example:\n\
        \n```json\n{\n  \"phone\": \"79001234567\",\n  \"body\": \"Pick a product\"\
        ,\n  \"cards\": [\n    {\n      \"header\": { \"type\": \"image\", \"image\"\
        : { \"link\": \"https://example.com/1.jpg\" } },\n      \"body\": { \"text\"\
        : \"Card one\" },\n      \"type\": \"cta_url\",\n      \"action\": { \"name\"\
        : \"cta_url\", \"parameters\": { \"url\": \"https://example.com/p1\", \"display_text\"\
        : \"Open\" } }\n    },\n    {\n      \"header\": { \"type\": \"image\", \"\
        image\": { \"link\": \"https://example.com/2.jpg\" } },\n      \"body\": {\
