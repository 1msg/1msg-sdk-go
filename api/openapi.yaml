info:
  contact:
    email: support@1msg.io
    name: 1MSG API Support
    url: https://help.1msg.io
  description: |
    Public client API for sending messages, managing groups, flows, and templates.

    This is the API exposed to end customers via platform.1msg.io

    **Authentication:** All requests require `token` query parameter with JWT or API key.

    **Documentation:** https://help.1msg.io/platform-1msg/getting-start/quick-start
    **API Docs:** https://docs.1msg.io/
  title: 1MSG WhatsApp Business API (Public)
  version: 1.0.0
servers:
- description: Production
  url: https://api.1msg.io
- description: Staging
  url: https://api-stage.1msg.io
- description: Local development
  url: http://127.0.0.1:3050
security:
- tokenAuth: []
tags:
- description: "Send messages, files, templates, and other content"
  name: Messaging
- description: "Block, unblock, and list blocked WhatsApp users"
  name: Users
- description: Channel profile information (read and update)
  name: Profile
- description: Channel status and automation settings
  name: Channel
- description: Catalog and cart commerce settings (`GET`/`POST /commerce`)
  name: Catalog
- description: Create and manage WhatsApp groups
  name: Groups
- description: WhatsApp Flows (interactive forms)
  name: Flows
- description: Get and manage message templates
  name: Templates
- description: Client webhook URL configuration
  name: Webhooks
- description: |
    WhatsApp Calling API (beta) — VoIP **signaling** proxy.

    1msg does **not** host media, store call history, or store recordings.
    You need your own WebRTC or SIP stack.

    ### Prerequisites
    - Meta Calling enabled on the number (Cloud API; not COEX)
    - Paid channel — trial / `subscriptionBlocked` → **403** plain text
    - Webhook URL configured (`POST /webhook`) for `calls` events

    ### Inbound (user → business)
    1. Webhook `type=calls`, `event=connect` — take `call_id` + SDP **offer**
    2. Optional: `POST /initiateCall` `action=pre_accept` + WebRTC **answer** SDP
    3. `action=accept` + WebRTC **answer** SDP, or `action=reject`
    4. Later `event=terminate`, or `action=terminate` to hang up

    Answer within ~**30–60s** or Meta ends as unanswered.

    **Critical:** `accept` / `pre_accept` need a **WebRTC-generated SDP answer**.
    Do **not** echo Meta's offer. Postman/curl alone cannot establish real media.

    ### Outbound (business → user)
    1. Send Call Permission Request (CPR) — template or interactive
    2. Wait for permission reply on the **messages** webhook (`call_permission_reply`)
    3. `POST /initiateCall` `action=connect` + business SDP **offer**
    4. Apply Meta's SDP **answer** from the `calls` connect webhook

    Meta limits (summary): permission ~7 days; up to 5 calls / 24h / user;
    max 2 CPR / 7 days; auto-revoke after 4 unanswered.

    ### Webhooks (`type=calls`)
    Passthrough of Meta `field=calls` plus `type`, `instanceId`.
    Events: connect (offer or answer SDP), statuses (`RINGING` / `ACCEPTED` /
    `REJECTED`), terminate. CPR replies use the messages path, not `type=calls`.

    See operations below for request bodies and examples.
  name: Calling
paths:
  /me:
    get:
      description: Get WhatsApp Business Account profile information
      operationId: getMe
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInfo"
          description: Profile information
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get Profile Info
      tags:
      - Profile
    post:
      description: |
        Update WhatsApp Business Account profile fields. At least one of
        about, description, email, photo, address, vertical, websites is required.
        Blocked when the channel subscription limit is exceeded.
      operationId: updateMe
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateMe_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Profile updated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Wrong request (no updatable fields)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Update profile info
      tags:
      - Profile
  /sendMessage:
    post:
      description: "Send a message to an existing chat. (Only if the dialogue has\
        \ an Open Session). \nThe message will be added to the queue for sending and\
        \ delivered even if the phone \nis disconnected from the Internet or authorization\
        \ is not passed.\n\nOnly one of two parameters is needed to determine the\
        \ destination - chatId or phone.\n"
      operationId: sendMessage
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
          application/json:
            example:
              body: Hello World
              phone: 12020721369
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSentResponse"
          description: Message sent successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request parameters
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Send a Message
      tags:
      - Messaging
