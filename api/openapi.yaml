          type: string
        websites:
          items:
            type: string
          type: array
      type: object
    ConversationalAutomation:
      additionalProperties: true
      example:
        enable_welcome_message: true
        prompts:
        - prompts
        - prompts
        - prompts
        - prompts
        commands:
        - command_name: command_name
          command_description: command_description
        - command_name: command_name
          command_description: command_description
        - command_name: command_name
          command_description: command_description
        - command_name: command_name
          command_description: command_description
        - command_name: command_name
          command_description: command_description
      properties:
        enable_welcome_message:
          description: Enable the automatic welcome message for new conversations
          type: boolean
        prompts:
          description: "Ice-breaker prompt strings (max 4, each ≤ 80 characters)"
