          description: Upstream create-template payload
          type: object
      type: object
    removeTemplate_request:
      properties:
        name:
          description: Template name to delete
          type: string
      required:
      - name
      type: object
    ConversationalAutomation_commands_inner:
      additionalProperties: true
      example:
        command_name: command_name
        command_description: command_description
      properties:
        command_name:
          maxLength: 32
          type: string
        command_description:
          maxLength: 256
          type: string
      required:
      - command_description
      - command_name
      type: object
    CallingSettings_calling_call_hours:
      additionalProperties: true
      description: Optional call hours / timezone configuration (Meta shape)
      example:
        timezone: America/Los_Angeles
        day_of_week_start: MONDAY
        status: ENABLED
      properties:
        status:
          example: ENABLED
          type: string
        timezone:
          example: America/Los_Angeles
          type: string
        day_of_week_start:
          example: MONDAY
          type: string
      type: object
    CallingSettings_calling_sip_servers_inner:
      additionalProperties: true
      example:
        hostname: sip.example.com
        password: password
        port: 5061
        sip_user_password: sip_user_password
        app_id: app_id
        request_uri_user_params:
          key: request_uri_user_params
      properties:
        hostname:
          example: sip.example.com
          type: string
        port:
          example: 5061
          type: integer
        request_uri_user_params:
          additionalProperties:
            type: string
          type: object
        sip_user_password:
          description: Present on GET when SIP credentials are returned by Meta
          type: string
        password:
          description: Alternate password field name from some Meta responses
          type: string
        app_id:
          type: string
      type: object
    CallingSettings_calling_sip:
      additionalProperties: true
      description: |
        SIP trunk settings. When SIP is ENABLED, Graph call actions and
        calling webhooks are not used — Meta dials your SIP server directly.
      example:
        servers:
        - hostname: sip.example.com
          password: password
          port: 5061
          sip_user_password: sip_user_password
          app_id: app_id
          request_uri_user_params:
            key: request_uri_user_params
        - hostname: sip.example.com
          password: password
          port: 5061
          sip_user_password: sip_user_password
          app_id: app_id
          request_uri_user_params:
            key: request_uri_user_params
        status: DISABLED
      properties:
        status:
          enum:
          - ENABLED
          - DISABLED
          example: DISABLED
          type: string
        servers:
          items:
            $ref: "#/components/schemas/CallingSettings_calling_sip_servers_inner"
          type: array
      type: object
    CallingSettings_calling_video:
      additionalProperties: true
      description: Video calling toggle when supported
      example:
        status: ENABLED
      properties:
        status:
          enum:
          - ENABLED
          - DISABLED
          type: string
      type: object
    CallingSettings_calling_audio:
      additionalProperties: true
      description: Audio settings (typically response-only)
      example:
        status: status
      properties:
        status:
          type: string
      type: object
    CallingSettings_calling:
      additionalProperties: true
      description: Calling feature configuration for the business phone number
      example:
        call_hours:
          timezone: America/Los_Angeles
          day_of_week_start: MONDAY
          status: ENABLED
        ip_addresses:
          key: ""
        restrictions:
          key: ""
        sip:
          servers:
          - hostname: sip.example.com
            password: password
            port: 5061
            sip_user_password: sip_user_password
            app_id: app_id
            request_uri_user_params:
              key: request_uri_user_params
          - hostname: sip.example.com
            password: password
            port: 5061
            sip_user_password: sip_user_password
            app_id: app_id
            request_uri_user_params:
              key: request_uri_user_params
          status: DISABLED
        video:
          status: ENABLED
        audio:
          status: status
        srtp_key_exchange_protocol: DTLS
        call_icons:
          key: ""
        status: ENABLED
        call_icon_visibility: DEFAULT
        callback_permission_status: ENABLED
      properties:
        status:
          description: Enable or disable Calling API on this number
          enum:
          - ENABLED
          - DISABLED
          example: ENABLED
          type: string
        call_icon_visibility:
          description: Controls call icon visibility in the WhatsApp client
          enum:
          - DEFAULT
          - DISABLE_ALL
          example: DEFAULT
          type: string
        callback_permission_status:
          description: |
            When ENABLED, a user who calls your business automatically grants
            call permission for business-initiated callbacks (subject to Meta rules).
          enum:
          - ENABLED
          - DISABLED
          example: ENABLED
          type: string
        srtp_key_exchange_protocol:
          description: |
            SRTP key exchange. DTLS is default/recommended.
            SDES is only valid when SIP signaling is enabled.
          enum:
          - DTLS
          - SDES
          example: DTLS
          type: string
        call_hours:
          $ref: "#/components/schemas/CallingSettings_calling_call_hours"
        sip:
          $ref: "#/components/schemas/CallingSettings_calling_sip"
        video:
          $ref: "#/components/schemas/CallingSettings_calling_video"
        audio:
          $ref: "#/components/schemas/CallingSettings_calling_audio"
        restrictions:
          additionalProperties: true
          description: Calling restrictions (response-only)
          type: object
        ip_addresses:
          additionalProperties: true
          description: Meta media IP ranges (response-only)
          type: object
        call_icons:
          additionalProperties: true
          description: Call icon country restrictions (response-only)
          type: object
      type: object
    InitiateCallRequest_session:
      additionalProperties: true
      description: WebRTC SDP session (required for connect / pre_accept / accept)
      example:
        sdp_type: offer
        sdp: "[REPLACE_WITH_WEBRTC_SDP]"
      properties:
        sdp_type:
          description: offer for outbound connect; answer for pre_accept/accept
          enum:
          - offer
          - answer
          example: offer
          type: string
        sdp:
          description: |
            Full SDP (RFC 8866). Replace placeholders with SDP from your WebRTC stack.
            Must negotiate ICE, DTLS-SRTP, and OPUS for WhatsApp media.
          example: "[REPLACE_WITH_WEBRTC_SDP]"
          type: string
      required:
      - sdp
      - sdp_type
      type: object
    InitiateCallResponse_calls_inner:
      additionalProperties: true
      example:
        id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
      properties:
        id:
          example: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
          type: string
      type: object
    InitiateCallResponse_response:
      additionalProperties: true
      description: Present when 1msg wraps an upstream error
      example:
        error: error
      properties:
        error:
          type: string
      type: object
    SendMessageRequest_directSend:
      additionalProperties: false
      description: |
        Optional. Ignored unless `category` is `utility` or `authentication`.
        `serviceFirst` is not forwarded to Meta.
      properties:
        serviceFirst:
          description: |
            When true, send a service message first. Success stops there.
            A closed-window error (131047) retries as Direct Send.
            Any other error is returned and Direct Send is not attempted.
            Omit or false to send Direct Send immediately, even inside an open window.
          type: boolean
        templateName:
          description: |
            Utility only. Meta creates or reuses a Direct Send template with this exact
            name (`^[a-z0-9_]+$`, max 512). Do not reuse a template created by hand.
          example: order_shipped
          maxLength: 512
          pattern: "^[a-z0-9_]+$"
          type: string
      type: object
  securitySchemes:
    tokenAuth:
      description: JWT token or API key
      in: query
      name: token
      type: apiKey
