components:
  parameters:
    flowId:
      description: Flow ID
      explode: false
      in: path
      name: flowId
      required: true
      schema:
        type: string
      style: simple
    token:
      description: JWT token or API key for authorization
      explode: true
      in: query
      name: token
      required: true
      schema:
        type: string
      style: form
    date:
      description: Filter by date (YYYY-MM-DD)
      explode: true
      in: query
      name: date
      required: false
      schema:
        format: date
        type: string
      style: form
    groupId:
      description: Group ID (phone number with country code)
      explode: false
      in: path
      name: groupId
      required: true
      schema:
        type: string
      style: simple
  requestBodies: {}
  responses:
    InvalidToken:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid or missing authentication token
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
    MessageSent:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageSentResponse"
      description: Message sent successfully
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Rate limit exceeded
    Success:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
      description: Operation successful
  schemas:
    ErrorResponse:
      description: Standard error response
      example:
        error: error
      properties:
        error:
          description: Error message
          type: string
      type: object
    MessageSentResponse:
      additionalProperties: true
      description: Response for successfully sent message
      example:
        description: description
        id: id
        message: message
        sent: true
      properties:
        sent:
          description: Whether the message was successfully queued for sending
          type: boolean
        id:
          description: Message ID
          type: string
        message:
          description: Status message
          type: string
        description:
          description: Detailed description
          type: string
      type: object
    SuccessResponse:
      additionalProperties: true
      description: Generic success response
      example:
        result: result
      properties:
        result:
          description: Operation result
          type: string
      type: object
    ProfileInfo:
      additionalProperties: true
      description: WhatsApp Business profile information
      example:
        address: address
        phone: phone
        about: about
        description: description
        photo: photo
        vertical: Automotive
        websites:
        - websites
        - websites
        email: email
      properties:
        about:
          description: Profile's About section
          type: string
        address:
          description: Address of the business
          type: string
        description:
          description: Description of the business
          type: string
        email:
          description: Business email
          type: string
        phone:
