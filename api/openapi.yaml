  /sendTemplate:
    post:
      description: |
        Send a WhatsApp **template** message (works outside the 24-hour session window).

        Use this tool — not `send_message` — when the 24h session is closed.

        `params` MUST be Cloud API **component objects**, never a flat list of strings
        and never the old On-Prem `hsm` / `localizable_params` format.

        Example body variable `{{1}}`:

        ```json
        {
          "type": "body",
          "parameters": [{ "type": "text", "text": "Ivan" }]
        }
        ```

        Do not send `"type": "hsm"` and do not send `params: ["Ivan", "123"]`.

        Supported `params` button `sub_type` values include: `url`, `quick_reply`,
        `copy_code` / `coupon_code`, `catalog`, `flow`, `limited_time_offer`, and
        **`order_details`** (WhatsApp Payments **India only** — requires an approved
        Utility template with an ORDER_DETAILS button).

        Convenience wrapper with structured fields: `POST /sendOrderDetails`.

        Authentication OTP templates (category `AUTHENTICATION`, or a template with
        an OTP / copy-code button) can only be sent to a phone number (`phone` or a
        phone `chatId`). Meta rejects a BSUID `recipient` for these templates with
        error 131062. If the recipient is known only by BSUID — for example they
        use a username and their phone number is not in your Business Portfolio —
        the template cannot be sent.

        A `REQUEST_CONTACT_INFO` button (UTILITY or MARKETING only) has no
        send-time parameters. Do not add a button component for it in `params`,
        and do not send button text — WhatsApp sets that label on the template.
        Create the button with `POST /addTemplate` as
        `{ "type": "REQUEST_CONTACT_INFO" }` with no `text`. Inside an open 24-hour
        window, `POST /sendContactInfo` asks for the number without a template.
      operationId: sendTemplate
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            example:
              template: test_buttons_2
              language:
                policy: deterministic
                code: ru
              namespace: 41123797_e45e_4f06_a2fa_443b27c6f5ec
              phone: "{{testPhone}}"
              params:
              - type: body
                parameters:
                - type: text
                  text: Ivan
            schema:
              $ref: "#/components/schemas/sendTemplate_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
      summary: Send Template Message
      tags:
      - Templates
