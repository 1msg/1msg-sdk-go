  /sendOrderDetails:
    post:
      description: |
        Send a WhatsApp **order details** payment / invoice message using a
        pre-approved **Utility** template that has an `ORDER_DETAILS` button.

        **India only** (WhatsApp Payments India). Requires:
        - India WhatsApp Business number
        - Commerce enabled on the channel (`GET`/`POST /commerce`)
        - Approved template with an `ORDER_DETAILS` button

        Use this method when you need structured fields (`order`, `referenceId`,
        `currency`, `paymentSettings`). The API appends a template button
        `sub_type: order_details` and sends via the same path as `POST /sendTemplate`.

        Works **outside the 24-hour session window** (template message).

        You can also send the same payload yourself with `POST /sendTemplate` by
        including a button component in `params`:

        ```json
        {
          "type": "button",
          "sub_type": "order_details",
          "index": 0,
          "parameters": [{
            "type": "action",
            "action": {
              "order_details": {
                "reference_id": "order-123",
                "currency": "INR",
                "order": { "status": "pending", "items": [], "subtotal": { "offset": 100, "value": 50000 } }
              }
            }
          }]
        }
        ```
      operationId: sendOrderDetails
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            example:
              phone: 919876543210
              template: order_details_utility
              namespace: your_namespace_uuid
              language:
                code: en
              referenceId: order-123
              currency: INR
              order:
                status: pending
                items:
                - retailer_id: SKU-1
                  name: Item
                  amount:
                    offset: 100
                    value: 50000
                  quantity: 1
                subtotal:
                  offset: 100
                  value: 50000
            schema:
              $ref: "#/components/schemas/sendOrderDetails_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSentResponse"
          description: Message sent successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request parameters
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Send order details (India payments template)
      tags:
      - Messaging
