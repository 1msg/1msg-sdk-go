        Proxies upstream `GET|POST /calling/settings`.
        Extra Meta fields may appear on GET responses; document core fields below.
      example:
        calling:
          call_hours:
            timezone: America/Los_Angeles
            day_of_week_start: MONDAY
            status: ENABLED
          ip_addresses:
            key: ""
          restrictions:
            key: ""
          sip:
            servers:
            - hostname: sip.example.com
              password: password
              port: 5061
              sip_user_password: sip_user_password
              app_id: app_id
              request_uri_user_params:
                key: request_uri_user_params
            - hostname: sip.example.com
              password: password
              port: 5061
              sip_user_password: sip_user_password
              app_id: app_id
              request_uri_user_params:
                key: request_uri_user_params
            status: DISABLED
          video:
            status: ENABLED
          audio:
            status: status
          srtp_key_exchange_protocol: DTLS
          call_icons:
            key: ""
          status: ENABLED
          call_icon_visibility: DEFAULT
          callback_permission_status: ENABLED
      properties:
        calling:
          $ref: "#/components/schemas/CallingSettings_calling"
      type: object
    InitiateCallRequest:
      additionalProperties: true
      description: |
        Call action payload for `POST /initiateCall` (proxies upstream `POST /calling/calls`).

        Despite the path name, this endpoint handles **all** call actions — not only
        outbound connect.

        ## Required fields by `action`

        | action | Required | `session` |
        |--------|----------|-----------|
        | `connect` (outbound) | `messaging_product`, `to`, `action` | `sdp_type: offer` + business WebRTC SDP |
        | `pre_accept` | `messaging_product`, `call_id`, `action` | `sdp_type: answer` (WebRTC-generated) |
        | `accept` | `messaging_product`, `call_id`, `action` | `sdp_type: answer` (WebRTC-generated) |
        | `reject` | `messaging_product`, `call_id`, `action` | none |
        | `terminate` | `messaging_product`, `call_id`, `action` | none |

        **Critical:** For `pre_accept` / `accept`, `session.sdp` must be a
        **WebRTC-generated SDP answer**. Do not echo Meta's offer SDP back.
        Postman alone cannot establish real media — you need a WebRTC (or SIP) stack.
      example:
        biz_opaque_callback_data: order-123-callback
        session:
          sdp_type: offer
          sdp: "[REPLACE_WITH_WEBRTC_SDP]"
        messaging_product: whatsapp
        action: connect
        to: "12185552828"
        call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
      properties:
        messaging_product:
          description: Must be `whatsapp`
          enum:
          - whatsapp
          example: whatsapp
          type: string
        action:
          description: Call control action
          enum:
          - connect
          - pre_accept
          - accept
          - reject
          - terminate
          example: connect
          type: string
        call_id:
          description: |
            WhatsApp call id from the inbound/outbound calls webhook (`calls[].id`).
            Required for `pre_accept`, `accept`, `reject`, `terminate`.
          example: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
          type: string
        to:
          description: |
            Recipient WhatsApp user phone (digits, country code, no +).
            Required for outbound `connect`.
          example: "12185552828"
          type: string
        biz_opaque_callback_data:
          description: Optional opaque string echoed on later call webhooks for correlation
          example: order-123-callback
          maxLength: 512
          type: string
        session:
          $ref: "#/components/schemas/InitiateCallRequest_session"
      required:
      - action
      - messaging_product
      type: object
    InitiateCallResponse:
      additionalProperties: true
      description: |
        Successful call action response from upstream, returned as-is.
        On empty upstream body, 1msg may return `{ "result": "success" }`.
        Upstream failures are often wrapped as HTTP 200 `{ "response": { "error": "..." } }`.
      example:
        result: success
        calls:
        - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
        - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
        success: true
        response:
          error: error
        messaging_product: whatsapp
      properties:
        messaging_product:
          example: whatsapp
          type: string
        success:
          example: true
          type: boolean
        calls:
          description: Present on outbound `connect` — contains the new call id
          items:
            $ref: "#/components/schemas/InitiateCallResponse_calls_inner"
          type: array
        result:
          description: Legacy success marker when upstream returns an empty body
          example: success
          type: string
        response:
          $ref: "#/components/schemas/InitiateCallResponse_response"
      type: object
    WebhookUrlStatus:
      additionalProperties: true
      description: |
        Circuit / auto-disable status for one configured webhook URL.
        The breaker is per URL (`instanceId` + URL hash), not per channel.
      example:
        nextProbeAt: 7
        reason: reason
        circuitState: ok
        trips: 9
        firstFailAt: 2
        url: https://openapi-generator.tech
        fails: 7
        disabledAt: 3
        lastStatus: 4
      properties:
        url:
          description: This webhook URL (same string as in `webhookUrl`)
          format: uri
          type: string
        circuitState:
          description: |
            Delivery state for this URL only. `ok` delivering; `degraded` recent qualifying fails (still delivering, warning email on the 2nd fail); `open` skipping most deliveries pending a probe; `half_open` probe in flight (resume only on HTTP 2xx); `disabled` sticky auto-disabled until self-serve re-enable (`POST /webhook` / `POST /settings` with this URL) or a successful probe before sticky disable.
          enum:
          - ok
          - degraded
          - open
          - half_open
          - disabled
          type: string
        reason:
          description: "Last qualifying fail reason, e.g. `http_404` or `timeout_or_network`"
          type: string
        fails:
          description: |
            Diagnostic only — safe for clients to ignore. Number of qualifying delivery
            failures in the rolling ~10 minute breaker window (not lifetime, not "how many
            times the customer retried"). Prefer `circuitState` / `disabledWebhooks`.
          type: integer
        trips:
          description: |
            Diagnostic only — safe for clients to ignore. How many recovery probes already
            failed for this URL. Probes run on a schedule (≈15 min → 1 h → 6 h); sticky
            disable after 3 failed probes. The 6 h step is the last probe, not a blind
            "unblock in 6 hours" timer.
          type: integer
        disabledAt:
          description: Epoch milliseconds when this URL became sticky-disabled
          type: integer
        firstFailAt:
          description: |
            Diagnostic only. Epoch ms of the first fail in the current ~10 minute window
            (pairs with `fails`; not a customer-facing period).
          type: integer
        lastStatus:
          description: "Last HTTP status from this URL, when known"
          type: integer
        nextProbeAt:
          description: "Epoch milliseconds of the next half-open probe, if any"
          type: integer
      required:
      - circuitState
      - url
      type: object
    SendMessageRequest:
