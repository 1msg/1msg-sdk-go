      type: object
    InitiateCallRequest:
      additionalProperties: true
      description: |
        Call action payload for `POST /initiateCall` (proxies upstream `POST /calling/calls`).

        Despite the path name, this endpoint handles **all** call actions — not only
        outbound connect.

        ## Required fields by `action`

        | action | Required | `session` |
        |--------|----------|-----------|
        | `connect` (outbound) | `messaging_product`, `to`, `action` | `sdp_type: offer` + business WebRTC SDP |
        | `pre_accept` | `messaging_product`, `call_id`, `action` | `sdp_type: answer` (WebRTC-generated) |
        | `accept` | `messaging_product`, `call_id`, `action` | `sdp_type: answer` (WebRTC-generated) |
        | `reject` | `messaging_product`, `call_id`, `action` | none |
        | `terminate` | `messaging_product`, `call_id`, `action` | none |

        **Critical:** For `pre_accept` / `accept`, `session.sdp` must be a
        **WebRTC-generated SDP answer**. Do not echo Meta's offer SDP back.
        Postman alone cannot establish real media — you need a WebRTC (or SIP) stack.
      example:
        biz_opaque_callback_data: order-123-callback
        session:
          sdp_type: offer
          sdp: "[REPLACE_WITH_WEBRTC_SDP]"
        messaging_product: whatsapp
        action: connect
        to: "12185552828"
        call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
      properties:
        messaging_product:
          description: Must be `whatsapp`
          enum:
          - whatsapp
          example: whatsapp
          type: string
        action:
          description: Call control action
          enum:
          - connect
          - pre_accept
          - accept
          - reject
          - terminate
          example: connect
          type: string
        call_id:
          description: |
            WhatsApp call id from the inbound/outbound calls webhook (`calls[].id`).
            Required for `pre_accept`, `accept`, `reject`, `terminate`.
          example: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
          type: string
        to:
          description: |
            Recipient WhatsApp user phone (digits, country code, no +).
            Required for outbound `connect`.
          example: "12185552828"
          type: string
        biz_opaque_callback_data:
          description: Optional opaque string echoed on later call webhooks for correlation
          example: order-123-callback
          maxLength: 512
          type: string
        session:
          $ref: "#/components/schemas/InitiateCallRequest_session"
      required:
      - action
      - messaging_product
      type: object
    InitiateCallResponse:
      additionalProperties: true
      description: |
        Successful call action response from upstream, returned as-is.
        On empty upstream body, 1msg may return `{ "result": "success" }`.
        Upstream failures are often wrapped as HTTP 200 `{ "response": { "error": "..." } }`.
      example:
        result: success
        calls:
        - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
        - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
        success: true
        response:
          error: error
        messaging_product: whatsapp
      properties:
        messaging_product:
          example: whatsapp
          type: string
        success:
          example: true
          type: boolean
        calls:
          description: Present on outbound `connect` — contains the new call id
          items:
            $ref: "#/components/schemas/InitiateCallResponse_calls_inner"
          type: array
        result:
          description: Legacy success marker when upstream returns an empty body
          example: success
          type: string
        response:
          $ref: "#/components/schemas/InitiateCallResponse_response"
      type: object
