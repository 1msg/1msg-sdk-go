          description: Internal server error
      summary: Get conversational automation settings
      tags:
      - Channel
    post:
      description: |
        Update WhatsApp conversational components.

        Allowed body fields (others are ignored):
        - `enable_welcome_message` (boolean)
        - `prompts` (string[], max 4, each ≤ 80 chars)
        - `commands` (`{ command_name, command_description }[]`)

        Proxies Meta/360dialog `POST /conversational_automation`.
      operationId: setConversationalAutomation
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            example:
              enable_welcome_message: true
              prompts:
              - How can I help?
              commands:
              - command_name: help
                command_description: Get support options
            schema:
              $ref: "#/components/schemas/ConversationalAutomation"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: |
            Updated settings from WABA, or legacy response.error wrapper on upstream failure.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Set conversational automation settings
      tags:
      - Channel
  /webhook:
    get:
      description: |
        Return the webhook URL(s) currently configured for this channel, plus delivery
        status for each URL.

        `webhookUrl` is a string when a single URL is set, an array of strings when
        multiple URLs are configured, or `null` if none is set.

        **Prefer `webhookStatuses`.** The circuit breaker is per URL, not per channel.
        If 1 of 4 URLs is sticky-disabled, that URL is skipped; the other three still
        receive events. Send/receive are not affected.

        Channel-level `haveDisabledWebhooks`, `circuitState`, `reason`, `fails`,
        `trips`, and timestamps are a compatibility summary of **one** URL (the first
        sticky-disabled URL, else the first configured URL). They are not "the channel
        is dead".

        - `haveDisabledWebhooks` — `true` when **at least one** URL in `webhookUrl` is
          sticky auto-disabled. Live URLs still get events.
        - `circuitState` — compressed scalar for that same primary URL:
          `ok` | `degraded` | `open` | `half_open` | `disabled`.
        - `disabledWebhooks` — currently configured URLs that are sticky-disabled
          (subset of `webhookUrl`).
        - `webhookStatuses` — one row per currently configured URL. Use this array
          to see which endpoints are live vs skipped.
        - `fails` / `trips` / `firstFailAt` — **diagnostics for support**, not product
          UI. `fails` = failures in a rolling ~10 minute window (not lifetime).
          `trips` = failed recovery probes on the 15 min → 1 h → 6 h schedule (sticky
          disable after 3). Clients can ignore these and use `webhookStatuses` +
          `disabledWebhooks` only.

        Sticky disable skips delivery; it does not unconfigure the URL (it stays in
        `webhookUrl`). Re-enable with `POST /webhook` or `POST /settings`. Those
        endpoints **replace** the whole list — with multiple URLs, send the full array.
      operationId: getWebhook
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                healthy:
                  summary: Single URL delivering
                  value:
                    webhookUrl: https://example.com/webhook
                    haveDisabledWebhooks: false
                    circuitState: ok
                    disabledWebhooks: []
                    webhookStatuses:
                    - url: https://example.com/webhook
                      circuitState: ok
                mixed:
                  summary: One of several URLs sticky-disabled
                  value:
                    webhookUrl:
                    - https://live.example.com/webhook
                    - https://down.example.com/webhook
                    haveDisabledWebhooks: true
                    circuitState: disabled
                    reason: http_404
                    fails: 1
                    trips: 3
                    disabledWebhooks:
                    - url: https://down.example.com/webhook
                      reason: http_404
                      state: disabled
                      fails: 1
                      trips: 3
                    webhookStatuses:
                    - url: https://live.example.com/webhook
                      circuitState: ok
                    - url: https://down.example.com/webhook
                      circuitState: disabled
                      reason: http_404
                      fails: 1
                      trips: 3
              schema:
                $ref: "#/components/schemas/getWebhook_200_response"
          description: Current webhook URL and per-URL circuit status
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get webhook URL
      tags:
      - Webhooks
    post:
      description: |
        Set the client webhook URL that receives inbound events for this channel.

        **Replaces** the stored webhook list (it does not append). To deliver the same
        events to several endpoints, pass an array in `webhookUrl` (max 5) or use
        `POST /settings`. With several URLs already configured, posting only the
        disabled URL **drops the others** — send the complete array to re-enable one
        of many.

        Incoming payloads include messages, delivery ACKs, group updates, coexistence
        echoes, and calling events. WhatsApp Calling payloads (`type: "calls"`) are
        documented under the **Calling** tag. Call permission replies arrive on the
        normal messages path (`call_permission_reply`).

        Repeating `POST /webhook` with the same URL(s) clears an auto-disable (self-serve
        re-enable). Send/receive are not affected by webhook auto-disable.
      operationId: setWebhook
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              single:
                summary: Single URL
                value:
                  webhookUrl: https://example.com/webhook
              multiple:
                summary: Several URLs (replaces the list)
                value:
                  webhookUrl:
                  - https://example.com/webhook
                  - https://backup.example.com/webhook
            schema:
              $ref: "#/components/schemas/setWebhook_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                set: true
                webhookUrl: https://example.com/webhook
              schema:
                $ref: "#/components/schemas/setWebhook_200_response"
          description: Webhook configured
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Set webhook URL
      tags:
      - Webhooks
  /callingSettings:
    get:
      description: |
        Return WhatsApp Calling API settings for this channel (beta).

        Proxies upstream `GET /calling/settings`.

        **Prerequisites**
        - Number must be eligible for Meta Calling (Cloud API; not COEX)
        - Trial / `subscriptionBlocked` channels receive **403** plain text
        - You need your own WebRTC or SIP stack; 1msg is a **signaling proxy** only
          and does **not** store call history or recordings

        See the **Calling** tag overview for inbound/outbound flows and webhooks.
      operationId: getCallingSettings
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                calling:
                  status: ENABLED
                  call_icon_visibility: DEFAULT
                  callback_permission_status: ENABLED
                  sip:
                    status: DISABLED
              schema:
                $ref: "#/components/schemas/CallingSettings"
          description: Calling settings (and possibly other Cloud API settings Meta
            returns)
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get calling settings
      tags:
      - Calling
    post:
      description: |
        Enable, disable, or update WhatsApp Calling settings (beta).

        Proxies upstream `POST /calling/settings`.
        Body is forwarded as-is (1msg does not validate fields).

        **Common fields under `calling`**
        - `status` (`ENABLED` | `DISABLED`) — required to turn calling on/off
        - `call_icon_visibility` (`DEFAULT` | `DISABLE_ALL`) — optional
        - `callback_permission_status` (`ENABLED` | `DISABLED`) — optional;
          when enabled, inbound user calls grant callback permission
        - `call_hours` — optional hours / timezone object
        - `sip` — optional SIP trunk; when SIP is ENABLED, Graph call actions and
          calling webhooks are not used
        - `srtp_key_exchange_protocol` (`DTLS` | `SDES`) — SDES only with SIP
        - `video.status` — optional

        Meta may accept only one feature group per request — prefer focused updates
        (e.g. enable status first, then SIP).

        Trial / `subscriptionBlocked` → **403** plain text.
      operationId: updateCallingSettings
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              enable:
                summary: Enable calling
                value:
                  calling:
                    status: ENABLED
                    call_icon_visibility: DEFAULT
                    callback_permission_status: ENABLED
              disable:
                summary: Disable calling
                value:
                  calling:
                    status: DISABLED
              enableSip:
                summary: Enable SIP (disables Graph call webhooks)
                value:
                  calling:
                    status: ENABLED
                    sip:
                      status: ENABLED
                      servers:
                      - hostname: sip.example.com
                        port: 5061
            schema:
              $ref: "#/components/schemas/CallingSettings"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
              schema:
                $ref: "#/components/schemas/updateCallingSettings_200_response"
          description: |
            Usually `{ "success": true }` from upstream, or legacy
            `{ "result": "success" }` / `{ "response": { "error": "..." } }`.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Update calling settings
      tags:
      - Calling
  /initiateCall:
    post:
      description: |
        Perform a WhatsApp Calling action (beta).

        Proxies upstream `POST /calling/calls`. Despite the historical path
        name `/initiateCall`, this endpoint handles **all** call actions:

        | action | Use | Required |
        |--------|-----|----------|
        | `connect` | Outbound business → user | `to` + `session` (`sdp_type: offer`) |
        | `pre_accept` | Inbound (optional, reduces audio clipping) | `call_id` + `session` (`sdp_type: answer`) |
        | `accept` | Inbound answer | `call_id` + `session` (`sdp_type: answer`) |
        | `reject` | Decline inbound | `call_id` |
        | `terminate` | Hang up | `call_id` |

        **SDP / media (critical)**
        - `accept` / `pre_accept` require a **WebRTC-generated SDP answer**.
        - Do **not** send Meta's offer SDP back as the answer.
        - Postman (or curl) alone **cannot** establish real media — you need a
          WebRTC or SIP stack. 1msg only proxies signaling.

        Answer within ~**30–60 seconds** of an inbound `connect` webhook or Meta
        terminates as unanswered. Common Meta errors include Calling not enabled
        (`138000`), no permission (`138006`), SDP validation failures.

        **Outbound** requires a prior Call Permission Request (CPR) acceptance.
        See the **Calling** tag overview for the full outbound flow and CPR limits.

        Trial / `subscriptionBlocked` → **403** plain text.
        Upstream failures often return HTTP 200 with `{ "response": { "error": "<upstream message>" } }`.
        `Invalid API KEY` is used only when Meta/360 body actually indicates an
        invalid API key or token. Other upstream 401s (notably call permission
        `138006`) pass through `error.message` / `error_user_msg`.
      operationId: initiateCall
      parameters:
      - description: JWT token or API key for authorization
        explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              outboundConnect:
                summary: Outbound connect (business SDP offer)
                value:
                  messaging_product: whatsapp
                  to: "12185552828"
                  action: connect
                  biz_opaque_callback_data: order-123
                  session:
                    sdp_type: offer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              preAccept:
                summary: Inbound pre_accept (WebRTC answer SDP)
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: pre_accept
                  session:
                    sdp_type: answer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              accept:
                summary: Inbound accept (WebRTC answer SDP)
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: accept
                  session:
                    sdp_type: answer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              reject:
                summary: Reject inbound call
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: reject
              terminate:
                summary: Terminate active call
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: terminate
            schema:
              $ref: "#/components/schemas/InitiateCallRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                success:
                  summary: Accept / pre_accept / reject / terminate success
                  value:
                    messaging_product: whatsapp
                    success: true
                connectSuccess:
                  summary: Outbound connect success (includes call id)
                  value:
                    messaging_product: whatsapp
                    calls:
                    - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
                upstreamError:
                  summary: Upstream error wrapped by 1msg
                  value:
                    response:
                      error: Calling not enabled
                callPermissionDenied:
                  summary: "Meta 138006 (upstream 401, not Invalid API KEY)"
                  value:
                    response:
                      error: No approved call permission from the recipient
                invalidApiKey:
                  summary: Real invalid D360/Meta token
                  value:
                    response:
                      error: Invalid API KEY
              schema:
                $ref: "#/components/schemas/InitiateCallResponse"
          description: "Call action result from upstream, or legacy error wrapper"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or missing authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Call action (connect / pre_accept / accept / reject / terminate)
      tags:
      - Calling
  /groups:
    get:
      description: "List WhatsApp groups for this channel. Paginate with `limit`,\
        \ `before`, and `after`."
      operationId: listGroups
