      explode: true
      in: query
      name: token
      required: true
      schema:
        type: string
      style: form
    date:
      description: Filter by date (YYYY-MM-DD)
      explode: true
      in: query
      name: date
      required: false
      schema:
        format: date
        type: string
      style: form
    groupId:
      description: Group ID (phone number with country code)
      explode: false
      in: path
      name: groupId
      required: true
      schema:
        type: string
      style: simple
  requestBodies: {}
  responses:
    InvalidToken:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid or missing authentication token
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
    MessageSent:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageSentResponse"
      description: Message sent successfully
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Rate limit exceeded
    Success:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
      description: Operation successful
  schemas:
    ErrorResponse:
      description: Standard error response
      example:
        error: error
      properties:
        error:
          description: Error message
          type: string
      type: object
    MessageSentResponse:
      additionalProperties: true
      description: Response for successfully sent message
      example:
        description: description
        id: id
